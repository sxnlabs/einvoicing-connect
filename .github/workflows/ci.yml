name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Un push qui en remplace un autre annule le run precedent : la CI ne paie pas
# deux fois pour un etat de branche qui n'existe plus.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # bundler-cache lance un `bundle install` non gele : sans ca il reecrit le
  # lock silencieusement, et les jobs valident un lock qui n'est pas celui du
  # depot. Un lock perime peut alors vivre indefiniment sur master.
  BUNDLE_FROZEN: "true"

jobs:
  # Le plancher declare par le gemspec et le Ruby courant. Les deux bords, pas
  # la fenetre complete : c'est la que les incompatibilites se manifestent, et
  # chaque job supplementaire se paie.
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
        env:
          # Un seul leg porte le seuil de couverture, voir spec/spec_helper.rb.
          COVERAGE_GATE: ${{ matrix.ruby == '4.0' && '1' || '0' }}

  # RuboCop ne depend pas de la version de Ruby qui l'execute : un seul job.
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop --format github

  audit:
    name: Vulnerabilites des dependances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec bundle-audit check --update

  # `bundle update` resout contre le Ruby de la machine qui le lance. Sur un
  # poste en 4.0 il choisit sans broncher une gem qui exige >= 3.3, et le lock
  # committe devient ininstallable sur le plancher declare. Ni les tests ni le
  # linter ne le voient : ils tournent sur le Ruby qui va bien.
  lock:
    name: Lock installable sur le plancher Ruby
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec ruby script/check_lock_ruby.rb --project .

  # Le vrai test d'empaquetage : la gem installee dans un bundle qui ne contient
  # qu'elle. Le spec de packaging lit lib/ et attrape les require non declares
  # meme quand ils dorment dans un corps de methode ; ce job prouve en plus que
  # ce qui en sort s'installe et se charge. Les deux sont complementaires.
  isolation:
    name: Chargement en bundle isole (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby script/check_isolated_load.rb --project .
