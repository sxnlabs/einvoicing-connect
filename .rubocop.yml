plugins:
  - rubocop-rspec

inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"

Metrics/MethodLength:
  Max: 30
Metrics/ClassLength:
  Max: 200
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
Style/Documentation:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 3
# Integration specs are grouped by platform, not mirrored on the lib/ tree.
RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/integration/**/*"
RSpec/ExampleLength:
  Max: 10
RSpec/MultipleMemoizedHelpers:
  Max: 10
# The packaging spec checks the gemspec against lib/, not a class.
RSpec/DescribeClass:
  Exclude:
    - "spec/runtime_dependencies_spec.rb"
